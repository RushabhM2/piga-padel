name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    env:
      IMAGE: africa-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/piga-padel/api:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate Service Account
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker africa-south1-docker.pkg.dev
  
      - name: Build API Docker image 
        run: docker build -t ${{ env.IMAGE }} ./api

      - name: Push build
        run: docker push ${{ env.IMAGE }}

      - name: Deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: piga-padel-api
          region: africa-south1
          image: ${{ env.IMAGE }}
          flags: --add-cloudsql-instances=${{ secrets.GCP_PROJECT_ID }}:africa-south1:piga-padel-db
          secrets: DATABASE_URL=piga-padel-database-url:latest
